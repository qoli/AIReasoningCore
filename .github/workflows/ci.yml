name: CI

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: swift test
      - run: swift format lint --recursive Sources Tests Smoke/AIReasoningSmoke/AIReasoningSmoke Package.swift
      - run: ./Scripts/test-ios-smoke-simulator.sh
