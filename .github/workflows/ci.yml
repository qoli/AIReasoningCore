name: CI

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: swift test
      - run: ./Scripts/test-cli-sigint.sh
      - run: ./Scripts/typecheck-ios-smoke.sh
      - run: ./Scripts/test-ios-smoke.sh
      - run: ./Scripts/verify-agent-cli-contracts.sh
      - run: ./Scripts/verify-smoke-agent-cli-fixtures.sh
      - run: ./Scripts/verify-upstreams.sh
      - run: ./Scripts/verify-no-ish-linkage.sh
